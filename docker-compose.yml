services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Tuned for a small Lightsail instance (512 MB to 1 GB RAM).
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=30", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB"]
    mem_limit: 256m
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: "${DB_PASSWORD:?create .env with DB_PASSWORD, see README}"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    mem_limit: 160m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: notebook
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: notebook
      NODE_OPTIONS: --max-old-space-size=96
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  dbdata:
